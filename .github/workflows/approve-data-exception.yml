name: Approve data exception

# The owner's approval for ONE data-contract exception (WP-F §6): a protected
# field, an availability change, an identity change, a row removal, or a
# migration. The data contract (scripts/validate-diff.mjs) lists each needed
# approval with these exact inputs; run this once per line, then re-run CI.
#
# It only records the approval as an artifact. validate-diff accepts it only if
# this run was a workflow_dispatch of THIS file on the default branch, it
# succeeded, it was triggered by the repository owner, and every input matches
# the exception exactly. Any change to the proposal (a new commit) voids it.

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'base_sha from the data-contract report'
        required: true
      proposal_sha256:
        description: 'proposal_sha256 from the data-contract report'
        required: true
      id:
        description: 'configuration id (or "-")'
        required: true
      field:
        description: 'field, @identity, @remove, @preowned-table, @top:<key> or *'
        required: true
      old:
        description: 'old value, exactly as in the report (JSON)'
        required: true
      new:
        description: 'new value, exactly as in the report (JSON)'
        required: true
      reason:
        description: 'why this exception is right (kept with the approval)'
        required: true

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the approver and the inputs
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          DEFAULT: refs/heads/${{ github.event.repository.default_branch }}
          BASE: ${{ inputs.base_sha }}
          HASH: ${{ inputs.proposal_sha256 }}
        run: |
          # Fail fast with a clear message; validate-diff re-checks all of this independently
          [ "$ACTOR" = "$OWNER" ] || { echo "Only the repository owner ($OWNER) can approve; this run was triggered by $ACTOR." >&2; exit 1; }
          [ "$REF" = "$DEFAULT" ] || { echo "Approvals must run from the default branch, not $REF." >&2; exit 1; }
          echo "$BASE" | grep -Eq '^[0-9a-f]{40}$' || { echo "base_sha must be a full 40-character commit SHA." >&2; exit 1; }
          echo "$HASH" | grep -Eq '^[0-9a-f]{64}$' || { echo "proposal_sha256 must be a 64-character hex hash." >&2; exit 1; }

      - name: Record the approval
        env:
          BASE: ${{ inputs.base_sha }}
          HASH: ${{ inputs.proposal_sha256 }}
          ID: ${{ inputs.id }}
          FIELD: ${{ inputs.field }}
          OLD: ${{ inputs.old }}
          NEW: ${{ inputs.new }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          mkdir -p "$RUNNER_TEMP/approval"
          node -e '
            const e = process.env
            const a = { base_sha: e.BASE, proposal_sha256: e.HASH, id: e.ID, field: e.FIELD, old: e.OLD, new: e.NEW, reason: e.REASON, approver: e.ACTOR, approved_at: new Date().toISOString() }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(a, null, 2) + "\n")
          ' "$RUNNER_TEMP/approval/approval.json"
          cat "$RUNNER_TEMP/approval/approval.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval
          path: ${{ runner.temp }}/approval/approval.json
          retention-days: 90
