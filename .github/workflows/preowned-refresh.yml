name: Pre-owned Pricing Refresh

# Runs scripts/refresh/preowned.mjs. When something changed it opens a
# data-only PR (the report is the description, for the record) and merges it
# straight away: the script follows fixed rules, validation has passed, and
# only lib/ev-data.json and lib/ev-data.provenance.json may change. Moves over
# the 15% guard are not applied; they go to the Data inbox issue for the agent.

on:
  schedule:
    # Off the hour: GitHub delays or drops the most runs at :00 and :30.
    - cron: '17 13 * * 1'   # Mondays 13:17 UTC (8:17 AM ET)
    - cron: '17 13 * * 2'   # Tuesdays: backup, runs only if Monday's didn't
  workflow_dispatch: {}

permissions:
  actions: read        # the Tuesday backup checks Monday's run
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: preowned-refresh
  cancel-in-progress: false

jobs:
  # Tuesday's schedule is a backup: GitHub's cron is best effort and sometimes
  # drops a run. It runs only if Monday's never succeeded.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: gate
        run: |
          run=yes
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%u)" = 2 ]; then
            if [ "$(bash scripts/refresh/ran-since.sh preowned-refresh.yml "$(date -u -d yesterday +%F)")" = yes ]; then
              run=no; echo "Monday's run succeeded; this backup run has nothing to do." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Unit tests
        run: npm run test:refresh

      - name: Wait for open data PRs
        id: open
        run: |
          # An unmerged refresh PR, or an agent PR waiting for review, could
          # conflict with this run's edits; skip until it is merged or closed.
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | test("^data-refresh/(preowned|agent)-"))] | length')
          echo "count=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" != "0" ]; then
            echo "A data PR is open (pre-owned or agent); this run waits for it to be merged or closed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch and reprice
        if: steps.open.outputs.count == '0'
        run: |
          node scripts/refresh/preowned.mjs --apply --report "$RUNNER_TEMP/report.md" --attention "$RUNNER_TEMP/attention.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate data
        if: steps.open.outputs.count == '0'
        run: npm run validate

      - name: Open and merge pull request
        if: steps.open.outputs.count == '0'
        run: |
          # Publication pause and schema check, read live just before writing (build spec E.3)
          gate=$(bash scripts/refresh/can-publish.sh)
          if [ "$gate" != yes ]; then echo "Not publishing: ${gate#no: }" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; no PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Data-only guard: this job may touch these files and nothing else.
          unexpected=$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -vxE 'lib/ev-data\.json|lib/ev-data\.provenance\.json|scripts/refresh/state/preowned\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed: $unexpected" >&2
            exit 1
          fi
          branch="data-refresh/preowned-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add lib/ev-data.json lib/ev-data.provenance.json
          git add -A scripts/refresh/state/
          git commit -m "data: pre-owned pricing refresh $(date -u +%F)"
          git push origin "$branch"
          url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Pre-owned pricing refresh $(date -u +%F)" \
            --body-file "$RUNNER_TEMP/report.md")
          gh pr merge "$url" --squash --delete-branch
          echo "Merged $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Send held moves to the Data inbox
        if: steps.open.outputs.count == '0'
        run: bash scripts/refresh/inbox.sh "Pre-owned pricing $(date -u +%F)" "$RUNNER_TEMP/attention.md"
