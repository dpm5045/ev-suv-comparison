name: Pre-owned Pricing Refresh

# Runs scripts/refresh/preowned.mjs. When something changed it opens a
# data-only PR (the report is the description, for the record) through
# scripts/refresh/publish-pr.sh, which runs the two required checks (build and
# the data contract) on it and merges it only when both pass and the contract
# flagged nothing for the owner (docs/plans/resume-publishing.md). Every
# repriced row carries a CarGurus source record the contract recomputes. Moves
# over the 15% guard are not applied; they go to the Data inbox for the agent.

on:
  schedule:
    # Off the hour: GitHub delays or drops the most runs at :00 and :30.
    - cron: '17 13 * * 1'   # Mondays 13:17 UTC (8:17 AM ET)
    - cron: '17 13 * * 2'   # Tuesdays: backup, runs only if Monday's didn't
  workflow_dispatch: {}

permissions:
  actions: write       # runs a required check that never started on its PR; the Tuesday backup reads Monday's run
  checks: read         # waits for the `build` check
  statuses: read       # waits for the `data-contract` status
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: preowned-refresh
  cancel-in-progress: false

jobs:
  # Tuesday's schedule is a backup: GitHub's cron is best effort and sometimes
  # drops a run. It runs only if Monday's never succeeded.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: gate
        run: |
          run=yes
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%u)" = 2 ]; then
            if [ "$(bash scripts/refresh/ran-since.sh preowned-refresh.yml "$(date -u -d yesterday +%F)")" = yes ]; then
              run=no; echo "Monday's run succeeded; this backup run has nothing to do." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One data publisher at a time, so each branches from an up-to-date default branch
    concurrency:
      group: data-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The default branch as it is now, not the commit that triggered the run: this job may
      # have waited for the data-publish lock while another publisher merged
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Unit tests
        run: npm run test:refresh

      - name: Tidy open data PRs
        id: tidy
        env:
          PUBLISH_TOKEN: ${{ secrets.DATA_PUBLISH_TOKEN }}   # opens/updates PRs as the owner
        run: bash scripts/refresh/tidy-prs.sh preowned --wait-for-agent

      - name: Fetch and reprice
        if: steps.tidy.outputs.skip != 'yes'
        run: |
          node scripts/refresh/preowned.mjs --apply --report "$RUNNER_TEMP/report.md" --attention "$RUNNER_TEMP/attention.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate data
        if: steps.tidy.outputs.skip != 'yes'
        run: npm run validate

      - name: Send held moves to the Data inbox
        if: steps.tidy.outputs.skip != 'yes'
        run: bash scripts/refresh/inbox.sh "Pre-owned pricing $(date -u +%F)" "$RUNNER_TEMP/attention.md"

      - name: Publish (PR, required checks, merge)
        id: publish
        if: steps.tidy.outputs.skip != 'yes'
        env:
          PUBLISH_TOKEN: ${{ secrets.DATA_PUBLISH_TOKEN }}   # opens/updates PRs as the owner
        run: |
          bash scripts/refresh/publish-pr.sh --producer preowned --intent auto \
            --allow 'lib/ev-data\.json|lib/ev-data\.provenance\.json|scripts/refresh/state/preowned\.json' \
            --title "Pre-owned pricing refresh $(date -u +%F)" --body-file "$RUNNER_TEMP/report.md"

      - name: Keep owner PRs current after this merge
        if: steps.publish.outputs.outcome == 'merged'
        env:
          PUBLISH_TOKEN: ${{ secrets.DATA_PUBLISH_TOKEN }}   # opens/updates PRs as the owner
        run: bash scripts/refresh/tidy-prs.sh preowned --owner-prs-only

      - name: Mark the run as paused (the backup schedule retries it)
        if: steps.publish.outputs.outcome == 'paused'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-paused
          path: ${{ runner.temp }}/paused/reason.txt
          retention-days: 14
