name: CI

# Baseline checks for every pull request and every push to master
# (build spec WP-A.1). Advisory until the required-check design in WP-I lands;
# merge only when it is green.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Pipeline tests
        run: npm run test:refresh

      - name: Unit tests
        run: npm run test:unit

      - name: Build (runs data validation first)
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Browser smoke tests (production server)
        run: npx playwright test
        env:
          CI: 'true'
