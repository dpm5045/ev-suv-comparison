name: CI

# Baseline checks for every pull request and every push to master
# (build spec WP-A.1). The `build` job is a required check on master.

on:
  pull_request:
  push:
    branches: [master]
  # The data publishers dispatch this on a PR branch whose `build` never started, as a fallback
  # (scripts/refresh/publish-pr.sh; docs/plans/resume-publishing.md, Rehearsal findings).
  workflow_dispatch: {}

permissions:
  contents: read
# The data contract between revisions is a separate, required workflow that runs
# from the default branch (data-contract.yml), so a PR can't edit or skip it.

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.58 cannot install browsers on
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Generated types match the schema
        run: node scripts/schema/gen-types.mjs --check

      - name: Lint
        run: npm run lint

      - name: Lint workflows (actionlint)
        run: |
          v=1.7.7
          curl -fsSL -o "$RUNNER_TEMP/al.tgz" "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          # Expressions, inputs, permissions and job wiring; shellcheck is not run on the scripts
          "$RUNNER_TEMP/actionlint" -color -shellcheck=

      - name: Type check
        run: npm run typecheck

      - name: Pipeline tests
        run: npm run test:refresh

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Generated-page checks (FAQ, structured data, metadata)
        run: npm run test:output

      - name: Install browser
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Browser smoke tests (production server)
        run: npx playwright test
        env:
          CI: 'true'
