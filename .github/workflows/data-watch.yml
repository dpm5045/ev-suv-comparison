name: Data Watch

# Runs scripts/refresh/watch.mjs: checks stored ranges against the EPA vehicle
# file, watches manufacturer and Car and Driver pages for price changes, and
# can correct range_mi where EPA alone settles it (planRangeFixes, --fix-ranges).
# Automatic range fixes are PAUSED (build spec WP-A.3) until fixes are keyed by
# configuration ID and limited to reviewed EPA mappings (WP-J.3); mismatches
# still go to the Data inbox.
#
# - It publishes only its bookkeeping (scripts/refresh/state/watch.json: what it
#   last saw) through scripts/refresh/publish-pr.sh: a PR that runs the two
#   required checks and merges itself (the default branch takes no direct
#   pushes). vercel.json skips the deploy for it. It no longer writes range
#   sources to provenance (docs/plans/resume-publishing.md §2).
# - Everything else it notices goes to the Data inbox issue for the agent.
# - `rehearsal` (manual runs only) publishes that bookkeeping even while
#   publication is paused, to prove the merge path before resuming.

on:
  schedule:
    # Off the hour: GitHub delays or drops the most runs at :00 and :30.
    - cron: '47 13 * * 1'   # Mondays 13:47 UTC (8:47 AM ET)
    - cron: '47 13 * * 2'   # Tuesdays: backup, runs only if Monday's didn't
  workflow_dispatch:
    inputs:
      rehearsal:
        description: 'Publish bookkeeping only (watch.json), even while paused: proves the bot merge path'
        type: boolean
        default: false

permissions:
  actions: write       # dispatches the required checks on its PR; the Tuesday backup reads Monday's run
  checks: read         # waits for the `build` check
  statuses: read       # waits for the `data-contract` status
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: data-watch
  cancel-in-progress: false

jobs:
  # Tuesday's schedule is a backup: GitHub's cron is best effort and sometimes
  # drops a run. It runs only if Monday's never succeeded.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: gate
        run: |
          run=yes
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%u)" = 2 ]; then
            if [ "$(bash scripts/refresh/ran-since.sh data-watch.yml "$(date -u -d yesterday +%F)")" = yes ]; then
              run=no; echo "Monday's run succeeded; this backup run has nothing to do." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  watch:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One data publisher at a time, so each branches from an up-to-date default branch
    concurrency:
      group: data-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Unit tests
        run: npm run test:refresh

      - name: Tidy open data PRs
        id: tidy
        run: bash scripts/refresh/tidy-prs.sh watch

      - name: Check EPA and price pages
        if: steps.tidy.outputs.skip != 'yes'
        run: |
          node scripts/refresh/watch.mjs --apply --report "$RUNNER_TEMP/report.md" --attention "$RUNNER_TEMP/attention.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate data
        if: steps.tidy.outputs.skip != 'yes'
        run: npm run validate

      - name: Send open items to the Data inbox
        if: steps.tidy.outputs.skip != 'yes' && !inputs.rehearsal
        run: bash scripts/refresh/inbox.sh "Data watch $(date -u +%F)" "$RUNNER_TEMP/attention.md"

      - name: Publish (PR, required checks, merge)
        id: publish
        if: steps.tidy.outputs.skip != 'yes'
        env:
          REHEARSAL: ${{ inputs.rehearsal && '--rehearsal' || '' }}
        run: |
          # REHEARSAL is empty or the one flag --rehearsal (left unquoted on purpose)
          bash scripts/refresh/publish-pr.sh --producer watch --intent auto $REHEARSAL \
            --allow 'scripts/refresh/state/watch\.json' \
            --title "Data watch: record state $(date -u +%F)" --body-file "$RUNNER_TEMP/report.md"

      - name: Mark the run as paused (the backup schedule retries it)
        if: steps.publish.outputs.outcome == 'paused'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-paused
          path: ${{ runner.temp }}/paused/reason.txt
          retention-days: 14
